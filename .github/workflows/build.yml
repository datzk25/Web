
name: Build NovaX for SmarterASP

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract source
        run: |
          if [ -f Web-main.zip ]; then
            unzip Web-main.zip -d source
          elif [ -f package.json ]; then
            mkdir source
            cp -r . source/
          else
            echo "Source not found"
            exit 1
          fi

      - name: Find project
        run: |
          FILE=$(find source -name package.json | head -1)
          test -n "$FILE"
          echo "PROJECT_DIR=$(dirname "$FILE")" >> $GITHUB_ENV

      - name: Install and build
        run: |
          cd "$PROJECT_DIR"
          npm ci
          npm run build

      - name: Package
        run: |
          mkdir -p output
          cp -r "$PROJECT_DIR/dist/." output/
          cat > output/web.config <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <configuration>
            <system.webServer>
              <rewrite>
                <rules>
                  <rule name="React SPA" stopProcessing="true">
                    <match url=".*" />
                    <conditions>
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
                      <add input="{REQUEST_FILENAME}" matchType="IsDirectory" negate="true" />
                    </conditions>
                    <action type="Rewrite" url="/index.html" />
                  </rule>
                </rules>
              </rewrite>
            </system.webServer>
          </configuration>
          EOF
          cd output
          zip -r ../NovaX-Hosting.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: NovaX-Hosting
          path: output/NovaX-Hosting.zip
