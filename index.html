    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovaXStore - Mua Bán Tài Nguyên Game Uy Tín #1 Việt Nam</title>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #05030c; color: #fff; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      #root { min-height: 100vh; position: relative; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: rgba(15,10,30,0.5); }
      ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, rgba(124,58,237,0.5), rgba(59,130,246,0.5)); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: linear-gradient(135deg, rgba(124,58,237,0.8), rgba(59,130,246,0.8)); }
      @keyframes shimmer { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
      @keyframes glow-pulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }
      @keyframes rgb-border { 0% { border-image-source: linear-gradient(0deg, #7c3aed, #3b82f6, #06b6d4, #7c3aed); } 25% { border-image-source: linear-gradient(90deg, #7c3aed, #3b82f6, #06b6d4, #7c3aed); } 50% { border-image-source: linear-gradient(180deg, #7c3aed, #3b82f6, #06b6d4, #7c3aed); } 75% { border-image-source: linear-gradient(270deg, #7c3aed, #3b82f6, #06b6d4, #7c3aed); } 100% { border-image-source: linear-gradient(360deg, #7c3aed, #3b82f6, #06b6d4, #7c3aed); } }
      @keyframes rgb-rotate { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
      @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
      @keyframes confetti-fall { 0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
      @keyframes neon-flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.85; } }
      @keyframes scan-line { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
      @keyframes count-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
